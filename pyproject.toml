[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ut-water-apportionment"
version = "0.1.0"
license = {text = "MIT"}
description = "After-the-fact accounting for Utah water rights"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "David Jones" }
]

keywords = [
    "water accounting",
    "water rights",
    "network flow",
    "linear programming",
    "hydrology"
]
dependencies = [
    "ortools>=9.10,<10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
scipy = [
    "numpy>=1.26",
    "scipy>=1.13",
]
highs = [
    "numpy>=1.26",
    "highspy>=1.7",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.6",
]
all = [
    "numpy>=1.26",
    "scipy>=1.13",
    "highspy>=1.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ut_water_apportionment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
